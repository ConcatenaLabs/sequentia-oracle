name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/Sequentia
          ref: master
          path: Sequentia
          fetch-depth: 1
          sparse-checkout: test/functional
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: formats and vectors
        env:
          SEQUENTIA_SRC: ${{ github.workspace }}/Sequentia
        run: python3 tests/test_attestation.py
